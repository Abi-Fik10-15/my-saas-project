name: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Set up a test database service container for the CI runner
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: ./api/package-lock.json

    - name: Install Dependencies
      working-directory: ./api
      run: npm ci

    - name: Generate Prisma Client & Run Migrations
      working-directory: ./api
      env:
        DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
      run: |
        npx prisma generate
        npx prisma migrate deploy

    - name: Run Linter
      working-directory: ./api
      run: npm run lint

    - name: Run Unit Tests
      working-directory: ./api
      run: npm run test

    - name: Build Application
      working-directory: ./api
      run: npm run build

  # Only run deployment if build-and-test passes AND it's a push to main
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/my-saas-project
          git pull origin main
          
          # Rebuild and restart with Docker Compose
          docker-compose -f docker-compose.prod.yml build
          docker-compose -f docker-compose.prod.yml up -d
          
          # Alternatively, if using PM2 locally on the server:
          # cd api && npm install && npm run build
          # pm2 restart api-service